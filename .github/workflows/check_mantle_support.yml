# Checks that every model in the Bedrock Mantle catalog works with
# ChatOpenAIMantle and ChatAnthropicMantle defaults (routing, parameters, tool
# calling, structured output), and refreshes the data those chat models rely on:
# the base path that serves each model, and the `reasoning_effort` levels in
# profile overrides.
#
# Daily runs check only models not yet in `_mantle_models.py`; Monday runs, and
# manual runs with "All models" coverage, check every model. Creates a pull request when the
# data changes. Fails when a checked model fails a check that needs a code change;
# the full report is in the run log.

name: "Check Bedrock Mantle model coverage"

on:
  schedule:
    # Daily: new models only.
    - cron: "0 9 * * 0,2-6"
    # Weekly: every model.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      coverage:
        description: "Model coverage"
        type: choice
        options:
          - New models only
          - All models
        default: New models only

env:
  PYTHON_VERSION: "3.13"
  REGIONS: "us-east-1 us-west-2"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: libs/aws
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }} + uv
        uses: "./.github/actions/uv_setup"
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        shell: bash
        run: uv sync --group test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check Mantle support
        id: check
        continue-on-error: true
        shell: bash
        env:
          FULL: ${{ inputs.coverage == 'All models' || github.event.schedule == '0 9 * * 1' }}
        run: |
          uv run python ../../.github/scripts/check_mantle_support.py \
            --write --changelog "${RUNNER_TEMP}/changelog.md" \
            $([ "$FULL" = "true" ] && echo --full) $REGIONS

      - name: Build PR body
        id: pr-body
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body_file="${RUNNER_TEMP}/pr_body.md"
          {
            echo "Updates Bedrock Mantle model support data from the daily support check."
            echo
            echo "🤖 Generated by the \`check_mantle_support\` workflow. Full report: [workflow run](${RUN_URL})."
            echo
            echo "## Summary of changes"
            echo
            cat "${RUNNER_TEMP}/changelog.md" 2>/dev/null || echo "No data changes."
          } > "${body_file}"
          echo "path=${body_file}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.MODEL_PROFILE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MODEL_PROFILE_BOT_PRIVATE_KEY }}

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/update-mantle-models
          title: "chore(aws): update Bedrock Mantle model support"
          commit-message: "chore(aws): update Bedrock Mantle model support"
          body-path: ${{ steps.pr-body.outputs.path }}
          add-paths: |
            libs/aws/langchain_aws/data/_mantle_models.py
            libs/aws/langchain_aws/data/profile_augmentations.toml

      - name: Summary
        if: always()
        shell: bash
        env:
          PR_OP: ${{ steps.create-pr.outputs.pull-request-operation }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: |
          if [ "${PR_OP}" = "created" ] || [ "${PR_OP}" = "updated" ]; then
            echo "### ✅ PR ${PR_OP}: ${PR_URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⏭️ No data changes" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if a model failed a check
        if: steps.check.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Some Mantle models fail with default settings and need a code change. See the report in the 'Check Mantle support' step."
          exit 1
